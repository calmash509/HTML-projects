<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaShortener - Premium URL Shortener</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Main App Wrap -->
    <div class="app-layout">
        
        <!-- Header/Navbar Area -->
        <header class="main-header">
            <div class="logo">Nova<span>Shortener</span></div>
            <div class="status-badge">System: Operational</div>
        </header>

        <!-- Main Content Hero Area -->
        <main class="hero-section">
            <div class="hero-content">
                <h1>Simplify Your Links</h1>
                <p>Paste your long URL below to instantly generate a clean, secure, and trackable short link.</p>
                
                <!-- Shortener Tool Row -->
                <div class="shortener-wrapper">
                    <form id="shortener-form" onsubmit="event.preventDefault();">
                        <div class="input-row">
                            <input 
                                type="url" 
                                id="long-url" 
                                placeholder="Paste a link here (e.g., https://example.com)" 
                                required
                            >
                            <button type="submit" id="shorten-btn">Shorten</button>
                        </div>
                    </form>

                    <!-- Result Panel (Hidden by default, target with JS) -->
                    <div id="result-container" class="result-panel">
                        <div class="result-row">
                            <input type="text" id="short-url" readonly value="https://nvsh.rt">
                            <button id="copy-btn">Copy</button>
                        </div>
                        <div id="toast" class="toast">✓ Copied to clipboard!</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="main-footer">
            <p>&copy; 2026 NovaShortener. No tracking. No cookies. Simple utility.</p>
        </footer>

    </div>
    <script src="script.js"></script>
</body>
</html>
